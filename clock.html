<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>森の時計｜森のしおり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* 時間帯ごとの色（JS で body に class を付ける） */
  body {
    --bg1: #f5f2ea; --bg2: #e3e8dc; --text: #24382c; --sub: #5c7a63; --line: rgba(36, 56, 44, 0.18);
    --frame: #5c7a63; --frame-dark: #3d5c46; --face: #fbfaf6;
    --sun: #c0392b; --sat: #2d6aa3;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: "Noto Serif JP", "Shippori Mincho", serif;
    color: var(--text);
    background: radial-gradient(circle at 25% 20%, var(--bg2), transparent 60%), var(--bg1);
    transition: background 1.5s ease, color 1.5s ease;
  }
  body.morning {
    --bg1: #eef5e4; --bg2: #cfe3bd; --text: #2f4a35; --sub: #5c7a63; --line: rgba(47, 74, 53, 0.2);
    --frame: #8fb06f; --frame-dark: #5f8247; --face: #fbfdf6;
  }
  body.day {
    --bg1: #f5f2ea; --bg2: #e3e8dc; --text: #24382c; --sub: #5c7a63; --line: rgba(36, 56, 44, 0.18);
    --frame: #5c7a63; --frame-dark: #3d5c46; --face: #fbfaf6;
  }
  body.evening {
    --bg1: #f6e3d3; --bg2: #e9b48e; --text: #5a2e17; --sub: #8a4f2d; --line: rgba(90, 46, 23, 0.2);
    --frame: #c06a3c; --frame-dark: #8e4422; --face: #fdf6ef;
  }
  body.night {
    --bg1: #1c2c22; --bg2: #2e4636; --text: #f5f2ea; --sub: #b9c9bb; --line: rgba(245, 242, 234, 0.22);
    --frame: #c9b98a; --frame-dark: #9c8d60; --face: #24382c;
    --sun: #f08a7e; --sat: #8fb8e0;
  }

  header {
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 700; letter-spacing: 0.1em; }
  header a {
    color: var(--sub);
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
  }
  header a:hover { text-decoration: underline; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 16px 56px;
  }

  h1 {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    letter-spacing: 0.3em;
    color: var(--sub);
    margin-bottom: 24px;
  }

  /* タイマー・時計・カレンダーを横に並べる（狭い画面では折り返す） */
  .layout {
    width: 100%;
    max-width: 1500px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: stretch; /* カレンダーを時計の列と同じ高さにのばす */
    gap: 40px 56px;
  }
  .timer { align-self: center; }
  .clock-side {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* クラシック時計 */
  .clock {
    width: min(92vw, 70vh, 500px);
    height: auto;
    display: block;
    filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.18));
  }
  .clock .rim-outer { fill: var(--frame-dark); transition: fill 1.5s ease; }
  .clock .rim       { fill: var(--frame); transition: fill 1.5s ease; }
  .clock .face      { fill: var(--face); stroke: var(--frame-dark); stroke-width: 2; transition: fill 1.5s ease; }
  .clock .tick      { stroke: var(--sub); stroke-width: 1.5; stroke-linecap: round; }
  .clock .tick.hour { stroke: var(--text); stroke-width: 4; }
  .clock .num {
    fill: var(--text);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    font-weight: 500;
    font-size: 30px;
  }
  .clock .hand        { stroke: var(--text); stroke-linecap: round; }
  .clock .hand-hour   { stroke-width: 9; }
  .clock .hand-minute { stroke-width: 6; }
  .clock .hand-second { stroke: #c0392b; stroke-width: 2.5; }
  .clock .pin         { fill: #c0392b; stroke: var(--face); stroke-width: 2; }

  .date {
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    font-weight: 500;
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    letter-spacing: 0.1em;
    margin-top: 32px;
  }

  .remain {
    margin-top: 28px;
    padding: 12px 28px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: clamp(0.95rem, 3vw, 1.1rem);
    letter-spacing: 0.1em;
    color: var(--sub);
  }
  .remain strong {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 1.3em;
    color: var(--text);
    margin: 0 2px;
  }

  /* カード（タイマー・カレンダー共通） */
  .panel {
    padding: 22px 18px 20px;
    background: var(--face);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    transition: background 1.5s ease;
  }

  /* 木の葉タイマー */
  .timer { width: min(100%, 300px); }
  .panel-title {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .tree { width: 100%; height: auto; display: block; overflow: visible; }
  .tree .trunk  { fill: #7a5634; }
  .tree .ground { fill: var(--line); }
  .tree .drop {
    transform-box: fill-box;
    transform-origin: center;
  }
  .tree .drop.fallen {
    animation: leaf-fall 3s ease-in forwards;
  }
  @keyframes leaf-fall {
    0%   { transform: translate(0, 0) rotate(0deg); }
    30%  { transform: translate(calc(var(--dx) * -0.6), calc(var(--dy) * 0.3)) rotate(90deg); }
    65%  { transform: translate(calc(var(--dx) * 0.8), calc(var(--dy) * 0.7)) rotate(200deg); }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0.8; }
  }
  .timer-display {
    font-size: clamp(2.4rem, 8vw, 3rem);
    font-weight: 700;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    margin: 4px 0 10px;
  }
  .timer-set {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .timer-set span { min-width: 4.5em; font-size: 1.05rem; }
  .timer-btn {
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .timer-btn.round { width: 40px; height: 40px; padding: 0; font-size: 1.3rem; }
  .timer-btn.main  { background: var(--frame); border-color: var(--frame); color: var(--face); }
  .timer-btn:hover:not(:disabled) { border-color: var(--frame); }
  .timer-btn:disabled { opacity: 0.35; cursor: default; }
  .song-select {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
    color: var(--sub);
  }
  .song-btn {
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--sub);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    cursor: pointer;
  }
  .song-btn[aria-pressed="true"] {
    color: var(--text);
    border-color: var(--frame);
    font-weight: 700;
    box-shadow: inset 0 0 0 1px var(--frame);
  }
  .timer-actions { display: flex; justify-content: center; gap: 10px; }
  .timer-msg { margin-top: 14px; min-height: 1.5em; font-size: 0.95rem; color: var(--sub); }
  .timer-msg button { margin-top: 8px; }

  /* 季節のカレンダー */
  .calendar {
    width: min(100%, 520px);
    display: flex;
    flex-direction: column;
  }
  .cal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .cal-title {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.1em;
  }
  .cal-nav {
    width: 36px;
    height: 36px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: transparent;
    color: var(--sub);
    font-size: 1.1rem;
    cursor: pointer;
  }
  .cal-nav:hover { background: var(--frame); color: var(--face); }
  .cal-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: auto;
    grid-auto-rows: 1fr;
    gap: 3px;
  }
  .cal-week {
    font-size: 1rem;
    font-weight: 700;
    color: var(--sub);
    padding-bottom: 6px;
  }
  .cal-day {
    min-height: 62px;
    padding: 4px 2px;
    border-radius: 6px;
    /* 日付のマスに薄い下地をつけて、数字を見つけやすくする */
    background: color-mix(in srgb, var(--frame) 12%, transparent);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .cal-day .d {
    font-size: 1.65rem;
    font-weight: 700;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .cal-day .ev {
    font-size: 0.72rem;
    font-weight: 500;
    line-height: 1.25;
    color: var(--sub);
  }
  .cal-day.holiday .ev { color: var(--sun); }
  .sun, .holiday .d { color: var(--sun); }
  .sat { color: var(--sat); }
  .cal-day.today {
    background: var(--frame);
    box-shadow: 0 0 0 3px var(--frame-dark);
  }
  .cal-day.today .d, .cal-day.today .ev { color: var(--face); }

  .season {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .season div { font-size: 0.95rem; }
  .season span {
    display: block;
    font-size: 0.75rem;
    color: var(--sub);
    margin-bottom: 2px;
  }

  /* スマホでは 時計 → タイマー → カレンダー の順 */
  @media (max-width: 760px) {
    .clock-side { order: -1; }
  }

  @media (max-width: 420px) {
    .calendar { padding: 18px 10px 16px; }
    .cal-day { min-height: 52px; }
    .cal-day .d { font-size: 1.35rem; }
    .cal-day .ev { font-size: 0.55rem; }
  }

  footer {
    text-align: center;
    padding: 20px 16px;
    font-size: 0.8rem;
    color: var(--sub);
  }
</style>
</head>
<body class="day">

<header>
  <p class="logo">森のしおり</p>
  <a href="index.html">← トップへもどる</a>
</header>

<main>
  <div class="layout">
    <section class="panel timer" aria-label="木の葉タイマー">
      <p class="panel-title">⏳ タイマー</p>
      <svg class="tree" viewBox="0 0 300 260" aria-hidden="true">
        <ellipse class="ground" cx="150" cy="246" rx="130" ry="10"/>
        <path class="trunk" d="M140 246 C142 210 143 185 138 160 L128 130 L134 128 L146 152 L150 112 L156 112 L157 150 L172 124 L178 128 L162 162 C158 190 160 215 162 246 Z"/>
        <g id="leaves"></g>
      </svg>
      <p class="timer-display" id="timer-display">25:00</p>
      <div class="timer-set">
        <button class="timer-btn round" id="timer-minus" type="button" aria-label="1分へらす">−</button>
        <span id="timer-min">25分</span>
        <button class="timer-btn round" id="timer-plus" type="button" aria-label="1分ふやす">＋</button>
      </div>
      <div class="song-select" role="group" aria-label="流す曲">
        <span>♪</span>
        <button class="song-btn" type="button" data-song="furusato">ふるさと</button>
        <button class="song-btn" type="button" data-song="momotaro">桃太郎</button>
      </div>
      <div class="timer-actions">
        <button class="timer-btn main" id="timer-start" type="button">スタート</button>
        <button class="timer-btn" id="timer-reset" type="button">リセット</button>
      </div>
      <div class="timer-msg" id="timer-msg" aria-live="polite"></div>
    </section>

    <div class="clock-side">
      <h1>森の時計</h1>
      <svg class="clock" viewBox="0 0 400 400" role="img" aria-labelledby="clock-label">
        <title id="clock-label">現在の時刻</title>
        <circle class="rim-outer" cx="200" cy="200" r="198"/>
        <circle class="rim" cx="200" cy="200" r="190"/>
        <circle class="face" cx="200" cy="200" r="170"/>
        <g id="ticks"></g>
        <g id="nums"></g>
        <line class="hand hand-hour" id="hand-hour" x1="200" y1="214" x2="200" y2="110"/>
        <line class="hand hand-minute" id="hand-minute" x1="200" y1="220" x2="200" y2="62"/>
        <line class="hand hand-second" id="hand-second" x1="200" y1="232" x2="200" y2="48"/>
        <circle class="pin" cx="200" cy="200" r="7"/>
      </svg>

      <p class="date" id="date">&nbsp;</p>
      <p class="remain">今年もあと<strong id="remain">--</strong>日</p>
    </div>

    <section class="panel calendar" aria-label="季節のカレンダー">
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev" type="button" aria-label="前の月">‹</button>
        <p class="cal-title" id="cal-title"></p>
        <button class="cal-nav" id="cal-next" type="button" aria-label="次の月">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="season">
        <div><span>行事</span><b id="season-event"></b></div>
        <div><span>旬</span><b id="season-food"></b></div>
        <div><span>花</span><b id="season-flower"></b></div>
      </div>
    </section>
  </div>
</main>

<footer>
  <p>&copy; 2026 森のしおり</p>
</footer>

<script>
  const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
  const SVG = "http://www.w3.org/2000/svg";

  // 文字盤の目盛りと数字（1〜12）を描く
  (function drawDial() {
    const ticks = document.getElementById("ticks");
    const nums = document.getElementById("nums");
    for (let i = 0; i < 60; i++) {
      const a = (i * 6) * Math.PI / 180;
      const isHour = i % 5 === 0;
      const r1 = isHour ? 150 : 158;
      const line = document.createElementNS(SVG, "line");
      line.setAttribute("x1", 200 + r1 * Math.sin(a));
      line.setAttribute("y1", 200 - r1 * Math.cos(a));
      line.setAttribute("x2", 200 + 164 * Math.sin(a));
      line.setAttribute("y2", 200 - 164 * Math.cos(a));
      line.setAttribute("class", isHour ? "tick hour" : "tick");
      ticks.appendChild(line);
    }
    for (let n = 1; n <= 12; n++) {
      const a = (n * 30) * Math.PI / 180;
      const t = document.createElementNS(SVG, "text");
      t.setAttribute("x", 200 + 126 * Math.sin(a));
      t.setAttribute("y", 200 - 126 * Math.cos(a));
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("dominant-baseline", "central");
      t.setAttribute("class", "num");
      t.textContent = n;
      nums.appendChild(t);
    }
  })();

  // ---- 季節のカレンダー ----

  // 月ごとの 行事・旬・花
  const SEASON = [
    ["お正月", "大根", "スイセン"],
    ["節分", "いちご", "梅"],
    ["ひな祭り", "はまぐり", "桃の花"],
    ["お花見", "たけのこ", "桜"],
    ["こどもの日", "新茶", "ツツジ"],
    ["衣替え", "梅の実", "アジサイ"],
    ["七夕", "とうもろこし", "アサガオ"],
    ["お盆", "すいか", "ヒマワリ"],
    ["お月見", "梨", "ヒガンバナ"],
    ["ハロウィン", "さつまいも", "コスモス"],
    ["七五三", "柿", "菊"],
    ["大みそか", "ゆず", "ポインセチア"]
  ];

  // 祝日ではない行事（月-日）
  const EVENTS = {
    "1-7": "七草", "2-3": "節分", "2-14": "バレンタイン", "3-3": "ひな祭り",
    "3-14": "ホワイトデー", "7-7": "七夕", "8-13": "お盆", "10-31": "ハロウィン",
    "11-15": "七五三", "12-25": "クリスマス", "12-31": "大みそか"
  };

  function nthWeekday(y, m, weekday, n) {
    const first = new Date(y, m - 1, 1).getDay();
    return 1 + ((weekday - first + 7) % 7) + (n - 1) * 7;
  }

  // その年の祝日（"月-日" → 名前）
  function holidaysOf(y) {
    const h = {
      "1-1": "元日", "2-11": "建国記念の日", "2-23": "天皇誕生日", "4-29": "昭和の日",
      "5-3": "憲法記念日", "5-4": "みどりの日", "5-5": "こどもの日", "8-11": "山の日",
      "11-3": "文化の日", "11-23": "勤労感謝の日"
    };
    h["1-" + nthWeekday(y, 1, 1, 2)] = "成人の日";
    h["7-" + nthWeekday(y, 7, 1, 3)] = "海の日";
    h["9-" + nthWeekday(y, 9, 1, 3)] = "敬老の日";
    h["10-" + nthWeekday(y, 10, 1, 2)] = "スポーツの日";
    const k = y - 1980, leap = Math.floor(k / 4);
    h["3-" + Math.floor(20.8431 + 0.242194 * k - leap)] = "春分の日";
    h["9-" + Math.floor(23.2488 + 0.242194 * k - leap)] = "秋分の日";

    const key = d => (d.getMonth() + 1) + "-" + d.getDate();
    const shift = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

    // 国民の休日（祝日にはさまれた日）
    for (let d = new Date(y, 0, 2); d.getFullYear() === y; d = shift(d, 1)) {
      if (!h[key(d)] && d.getDay() !== 0 && h[key(shift(d, -1))] && h[key(shift(d, 1))]) {
        h[key(d)] = "国民の休日";
      }
    }
    // 振替休日（日曜の祝日のあと、最初の祝日でない日）
    Object.keys(h).forEach(function (md) {
      const [m, dd] = md.split("-").map(Number);
      let d = new Date(y, m - 1, dd);
      if (d.getDay() !== 0) return;
      do { d = shift(d, 1); } while (h[key(d)]);
      h[key(d)] = "振替休日";
    });
    return h;
  }

  let viewYear, viewMonth; // 表示中の年・月（月は 0〜11）

  function renderCalendar() {
    const today = new Date();
    const holidays = holidaysOf(viewYear);
    const grid = document.getElementById("cal-grid");
    grid.innerHTML = "";

    document.getElementById("cal-title").textContent = viewYear + "年 " + (viewMonth + 1) + "月";

    WEEK.forEach(function (w, i) {
      const el = document.createElement("div");
      el.className = "cal-week" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
      el.textContent = w;
      grid.appendChild(el);
    });

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const days = new Date(viewYear, viewMonth + 1, 0).getDate();
    for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement("div"));

    for (let d = 1; d <= days; d++) {
      const md = (viewMonth + 1) + "-" + d;
      const wd = (firstDay + d - 1) % 7;
      const cell = document.createElement("div");
      let cls = "cal-day";
      if (wd === 0) cls += " sun";
      if (wd === 6) cls += " sat";
      if (holidays[md]) cls += " holiday";
      if (viewYear === today.getFullYear() && viewMonth === today.getMonth() && d === today.getDate()) cls += " today";
      cell.className = cls;

      const num = document.createElement("span");
      num.className = "d";
      num.textContent = d;
      cell.appendChild(num);

      [holidays[md], EVENTS[md]].forEach(function (name) {
        if (!name) return;
        const ev = document.createElement("span");
        ev.className = "ev";
        ev.textContent = name;
        cell.appendChild(ev);
      });
      grid.appendChild(cell);
    }

    const s = SEASON[viewMonth];
    document.getElementById("season-event").textContent = s[0];
    document.getElementById("season-food").textContent = s[1];
    document.getElementById("season-flower").textContent = s[2];
  }

  function moveMonth(n) {
    const d = new Date(viewYear, viewMonth + n, 1);
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
    renderCalendar();
  }
  document.getElementById("cal-prev").addEventListener("click", function () { moveMonth(-1); });
  document.getElementById("cal-next").addEventListener("click", function () { moveMonth(1); });

  // ---- 木の葉タイマー ----

  const LEAF_COUNT = 40;
  const LEAF_COLORS = ["#3d5c46", "#5f8247", "#7a9a5e", "#8fb06f", "#a8c47e"];
  const leaves = [];

  // 木の葉を並べる（毎回同じ形になるよう、決まった乱数を使う）
  (function drawLeaves() {
    let seed = 7;
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const group = document.getElementById("leaves");
    for (let i = 0; i < LEAF_COUNT; i++) {
      const a = rand() * Math.PI * 2;
      const r = Math.sqrt(rand());
      const x = 150 + Math.cos(a) * r * 95;
      const y = 95 + Math.sin(a) * r * 62;
      const drop = document.createElementNS(SVG, "g");
      drop.setAttribute("class", "drop");
      drop.style.setProperty("--dx", Math.round((rand() - 0.5) * 120) + "px");
      drop.style.setProperty("--dy", Math.round(240 - y + rand() * 8) + "px");
      drop.style.setProperty("--rot", Math.round(rand() * 360) + "deg");
      const leaf = document.createElementNS(SVG, "path");
      leaf.setAttribute("d", "M0 -11 C7 -6 7 6 0 11 C-7 6 -7 -6 0 -11 Z");
      leaf.setAttribute("fill", LEAF_COLORS[Math.floor(rand() * LEAF_COLORS.length)]);
      leaf.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + Math.round(rand() * 360) + ")");
      drop.appendChild(leaf);
      group.appendChild(drop);
      leaves.push(drop);
    }
    // 散る順番をばらばらにする
    for (let i = leaves.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [leaves[i], leaves[j]] = [leaves[j], leaves[i]];
    }
  })();

  // オルゴールの曲（どちらも岡野貞一作曲。音の高さ, 長さ[拍]、null は休み）
  const FURUSATO = [
    [79, 1], [79, 1], [79, 1], [81, 1.5], [83, 0.5], [81, 1], [83, 1], [83, 1], [84, 1], [86, 2], [null, 1],
    [84, 1], [86, 1], [88, 1], [83, 1.5], [84, 0.5], [83, 1], [81, 1], [81, 1], [78, 1], [79, 2], [null, 1],
    [81, 0.5], [79, 0.5], [81, 1], [74, 1], [79, 0.5], [81, 0.5], [83, 1], [83, 1],
    [84, 0.5], [83, 0.5], [84, 1.5], [88, 0.5], [86, 0.5], [84, 0.5], [83, 1], [null, 1],
    [86, 1], [86, 1], [86, 1], [79, 1.5], [81, 0.5], [83, 1], [84, 1], [84, 1], [81, 1], [79, 2], [null, 1]
  ];
  const MOMOTARO = [
    [81, 1.5], [83, 0.5], [81, 0.5], [81, 0.5], [78, 1], [81, 0.5], [81, 0.5], [78, 0.5], [74, 0.5], [76, 1.5], [null, 0.5],
    [74, 0.5], [74, 0.5], [76, 0.5], [76, 0.5], [78, 0.5], [78, 0.5], [76, 1], [78, 0.5], [78, 0.5], [83, 0.5], [83, 0.5], [81, 1.5], [null, 0.5],
    [86, 0.5], [86, 0.5], [81, 1], [78, 0.5], [78, 0.5], [83, 0.5], [83, 0.5], [81, 0.5], [81, 0.5], [78, 0.5], [76, 0.5], [74, 1.5], [null, 0.5]
  ];
  const SONGS = {
    furusato: { notes: FURUSATO, beat: 0.68 },  // 1拍の秒数
    momotaro: { notes: MOMOTARO, beat: 0.52 }
  };
  let songName = "furusato";
  try { if (SONGS[localStorage.getItem("mori-timer-song")]) songName = localStorage.getItem("mori-timer-song"); } catch (e) {}

  let audio = null;
  let musicNodes = [];
  let musicTimer = null;

  function musicBoxNote(freq, start, dur) {
    const out = audio.createGain();
    out.gain.setValueAtTime(0, start);
    out.gain.linearRampToValueAtTime(0.28, start + 0.005);
    out.gain.exponentialRampToValueAtTime(0.001, start + Math.max(dur, 1.4));
    out.connect(audio.destination);
    // 基音＋高い倍音で、金属の歯を弾いたような音にする
    [[1, 1], [2.01, 0.35], [4.2, 0.12]].forEach(function (p) {
      const osc = audio.createOscillator();
      const g = audio.createGain();
      osc.type = "sine";
      osc.frequency.value = freq * p[0];
      g.gain.value = p[1];
      osc.connect(g).connect(out);
      osc.start(start);
      osc.stopTime = start + Math.max(dur, 1.4) + 0.05;
      osc.stop(osc.stopTime);
      musicNodes.push(osc);
    });
  }

  // 「音を止める」を押すまで、1回分ずつ予約してくり返す
  function playSong() {
    silence();
    let t = audio.currentTime + 0.1;
    (function round() {
      const song = SONGS[songName];
      song.notes.forEach(function (n) {
        const len = n[1] * song.beat;
        if (n[0] !== null) musicBoxNote(440 * Math.pow(2, (n[0] - 69) / 12), t, len);
        t += len;
      });
      t += song.beat;
      // 鳴り終わった音は片づける
      musicNodes = musicNodes.filter(function (o) { return o.stopTime > audio.currentTime; });
      musicTimer = setTimeout(round, Math.max(0, (t - audio.currentTime - 1) * 1000));
    })();
  }

  function silence() {
    musicNodes.forEach(function (o) { try { o.stop(); } catch (e) {} });
    musicNodes = [];
    clearTimeout(musicTimer);
  }

  function stopMusic() {
    silence();
    const stopBtn = document.getElementById("music-stop");
    if (stopBtn) stopBtn.remove();
  }

  let setMinutes = 25;
  let remainMs = setMinutes * 60000;
  let endAt = 0;        // 動いている間の終わる時刻
  let tickTimer = null;
  let doneTimer = null; // 別のタブを見ている間も、時間ぴったりに鳴らすため
  let state = "idle";   // idle / running / paused / done

  function fmt(ms) {
    const s = Math.ceil(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  function drawTimer() {
    document.getElementById("timer-display").textContent = fmt(remainMs);
    document.getElementById("timer-min").textContent = setMinutes + "分";
    const total = setMinutes * 60000;
    const left = state === "idle" ? LEAF_COUNT : Math.ceil(LEAF_COUNT * remainMs / total);
    leaves.forEach(function (leaf, i) {
      leaf.classList.toggle("fallen", i >= left);
    });
    const editable = state === "idle";
    document.getElementById("timer-minus").disabled = !editable || setMinutes <= 1;
    document.getElementById("timer-plus").disabled = !editable || setMinutes >= 120;
    document.getElementById("timer-start").textContent =
      state === "running" ? "一時停止" : state === "paused" ? "再開" : "スタート";
    document.getElementById("timer-start").disabled = state === "done";
  }

  function tick() {
    if (state !== "running") return;
    remainMs = Math.max(0, endAt - Date.now());
    if (remainMs === 0) {
      clearInterval(tickTimer);
      clearTimeout(doneTimer);
      state = "done";
      const msg = document.getElementById("timer-msg");
      msg.innerHTML = "🍂 時間です！<br>";
      const stopBtn = document.createElement("button");
      stopBtn.className = "timer-btn";
      stopBtn.id = "music-stop";
      stopBtn.type = "button";
      stopBtn.textContent = "♪ 音を止める";
      stopBtn.addEventListener("click", stopMusic);
      msg.appendChild(stopBtn);
      playSong();
    }
    drawTimer();
  }

  function changeMinutes(n) {
    if (state !== "idle") return;
    setMinutes = Math.min(120, Math.max(1, setMinutes + n));
    remainMs = setMinutes * 60000;
    drawTimer();
  }

  // ＋−は押し続けると続けて変わる
  function holdButton(id, n) {
    const btn = document.getElementById(id);
    let wait = null, repeat = null;
    const stop = function () { clearTimeout(wait); clearInterval(repeat); };
    btn.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      changeMinutes(n);
      wait = setTimeout(function () { repeat = setInterval(function () { changeMinutes(n); }, 120); }, 450);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { btn.addEventListener(ev, stop); });
    btn.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); changeMinutes(n); }
    });
  }
  holdButton("timer-minus", -1);
  holdButton("timer-plus", 1);

  // 曲の切り替え（選んだ曲はこのブラウザに覚えておく）
  function drawSongButtons() {
    document.querySelectorAll(".song-btn").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.song === songName);
    });
  }
  document.querySelectorAll(".song-btn").forEach(function (b) {
    b.addEventListener("click", function () {
      songName = b.dataset.song;
      try { localStorage.setItem("mori-timer-song", songName); } catch (e) {}
      drawSongButtons();
    });
  });
  drawSongButtons();

  document.getElementById("timer-start").addEventListener("click", function () {
    // 音はボタンを押したときに準備しておく（スマホで鳴らすため）
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();

    if (state === "running") {
      clearInterval(tickTimer);
      clearTimeout(doneTimer);
      remainMs = Math.max(0, endAt - Date.now());
      state = "paused";
    } else {
      endAt = Date.now() + remainMs;
      state = "running";
      tickTimer = setInterval(tick, 250);
      doneTimer = setTimeout(tick, remainMs + 20);
    }
    drawTimer();
  });

  document.getElementById("timer-reset").addEventListener("click", function () {
    clearInterval(tickTimer);
    clearTimeout(doneTimer);
    stopMusic();
    state = "idle";
    remainMs = setMinutes * 60000;
    document.getElementById("timer-msg").textContent = "";
    drawTimer();
  });

  drawTimer();

  // ---- 時計 ----

  function themeFor(hour) {
    if (hour >= 6 && hour < 10) return "morning";
    if (hour >= 10 && hour < 17) return "day";
    if (hour >= 17 && hour < 19) return "evening";
    return "night";
  }

  let lastDateKey = "";

  function update() {
    const now = new Date();

    // 針の角度（12時の方向が0度）
    const sec = now.getSeconds();
    const min = now.getMinutes() + sec / 60;
    const hour = (now.getHours() % 12) + min / 60;
    document.getElementById("hand-hour").setAttribute("transform", "rotate(" + hour * 30 + " 200 200)");
    document.getElementById("hand-minute").setAttribute("transform", "rotate(" + min * 6 + " 200 200)");
    document.getElementById("hand-second").setAttribute("transform", "rotate(" + sec * 6 + " 200 200)");

    document.body.className = themeFor(now.getHours());

    // 日付が変わったときだけ、日付・残り日数・カレンダーを書きかえる
    const dateKey = now.toDateString();
    if (dateKey === lastDateKey) return;
    lastDateKey = dateKey;

    document.getElementById("date").textContent =
      now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日（" + WEEK[now.getDay()] + "）";

    // 今日を数えずに、12月31日までの日数
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const lastDay = new Date(now.getFullYear(), 11, 31);
    document.getElementById("remain").textContent = Math.round((lastDay - today) / 86400000);

    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    renderCalendar();
  }

  update();
  // 秒が変わる瞬間にそろえて、1秒ごとに更新する（秒針がチクタク動く）
  setTimeout(function () {
    update();
    setInterval(update, 1000);
  }, 1000 - (Date.now() % 1000));
</script>
